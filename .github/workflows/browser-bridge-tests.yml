name: Browser-first native project bridge

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/bin/browser_bridge.rs'
      - 'src-tauri/src/bin/browser_archive.rs'
      - 'src-tauri/src/commands/project_archive.rs'
      - 'src/services/browserTransport.ts'
      - 'src/services/tauriApi.ts'
      - 'src/services/archiveApi.ts'
      - 'src/services/imageLoader.ts'
      - 'scripts/dev-web.mjs'
      - 'scripts/browser-bridge-smoke.mjs'
      - 'scripts/browser-ui-smoke.mjs'
      - 'docs/BROWSER_FIRST_DEVELOPMENT.md'
      - 'tests/browserTransport.test.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/browser-bridge-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/bin/browser_bridge.rs'
      - 'src-tauri/src/bin/browser_archive.rs'
      - 'src-tauri/src/commands/project_archive.rs'
      - 'src/services/browserTransport.ts'
      - 'src/services/tauriApi.ts'
      - 'src/services/archiveApi.ts'
      - 'src/services/imageLoader.ts'
      - 'scripts/dev-web.mjs'
      - 'tests/browserTransport.test.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/browser-bridge-tests.yml'

permissions:
  contents: read

jobs:
  browser-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser proxy authentication and error propagation
        run: node --experimental-strip-types --test tests/browserTransport.test.mjs
      - name: Frontend TypeScript and Vite build
        run: npm run build

  native-browser-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libudev-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile and test local Rust bridge
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin browser_bridge
      - name: Build executable browser bridge and native archive CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin browser_bridge --bin browser_archive
      - name: Generate and independently verify rights-cleared RMXP ZIP fixture
        env:
          PROJECT_ROUNDTRIP_EVIDENCE_DIR: ${{ runner.temp }}/browser-fixture
        run: python3 scripts/run_project_roundtrip.py
      - name: Native ZIP import → HTTP map/event/PBS edit → native ZIP export → independent preservation test
        run: node scripts/browser-bridge-smoke.mjs "${{ runner.temp }}/browser-fixture/original.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser UI test dependencies (no Android emulator)
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Real Chromium React UI paint → save → native ZIP export → reimport
        env:
          BROWSER_UI_EVIDENCE_DIR: ${{ runner.temp }}/browser-ui-evidence
        run: node scripts/browser-ui-smoke.mjs "${{ runner.temp }}/browser-fixture/original.zip"
      - name: Preserve browser screenshots and runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essentials-browser-ui-runtime-evidence
          path: ${{ runner.temp }}/browser-ui-evidence/
          if-no-files-found: warn
          retention-days: 7
