name: Event Marshal fidelity tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src-tauri/src/commands/event_merge.rs'
      - 'src-tauri/src/models/event.rs'
      - '.github/workflows/event-fidelity-tests.yml'

permissions:
  contents: read

concurrency:
  group: event-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event-fidelity:
    name: Native XP event fidelity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend resources
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify event page/command Marshal preservation
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib commands::event_merge::tests -- --nocapture
