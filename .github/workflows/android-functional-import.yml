name: Android emulator functional ZIP import

on:
  # Milestone gate: only an integrated main candidate or explicit dispatch,
  # never each intermediate PR commit. Native and ARM64 checks remain PR gates.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/android-emulator-*.py'
      - 'scripts/android-emulator-*.sh'
      - '.github/workflows/android-functional-import.yml'

permissions:
  contents: read

concurrency:
  group: android-functional-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    # Avoid the Ubuntu 22.04 Azure mirror that stalled apt for the full 60m
    # in run 41250200427, cancelling an otherwise successful Android build.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          set -euo pipefail
          # Prefer the canonical HTTPS mirror over intermittent Azure HTTP mirrors.
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          # Fail promptly on an unhealthy package mirror, not after an hour.
          timeout 300s sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Generate rights-cleared synthetic RMXP ZIP with native Ruby Marshal models
        env:
          PROJECT_ROUNDTRIP_ARTIFACT_DIR: ${{ runner.temp }}/android-fixture
        run: |
          npm ci
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib wrapped_rxdata_project_opens_edits_and_reads_back_without_losing_source_members -- --nocapture
          test -s "$PROJECT_ROUNDTRIP_ARTIFACT_DIR/original.zip"
          python3 - "$PROJECT_ROUNDTRIP_ARTIFACT_DIR/original.zip" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              paths=set(archive.namelist())
              for name in ("Game.rxproj","Data/Map001.rxdata","Data/MapInfos.rxdata","PBS/pokemon.txt"):
                  assert any(p.endswith(name) for p in paths), name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-synthetic-import-${{ github.sha }}
          path: ${{ runner.temp }}/android-fixture/original.zip
          if-no-files-found: error
          retention-days: 7

  build-x86:
    name: Compile x86_64 Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check import UI selectors and shell syntax
        run: |
          bash -n scripts/android-emulator-smoke.sh
          python3 scripts/android-emulator-import-smoke.py --self-test
          python3 scripts/android-emulator-map-save-smoke.py --self-test
          python3 scripts/android-emulator-saf-export-smoke.py --self-test
          python3 scripts/android-emulator-export-reimport-smoke.py --self-test
          bash -n scripts/android-emulator-functional-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Generate Android Gradle project
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npm run tauri android init -- --ci
      - name: Compile x86_64 Android debug APK
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # Maven Central can return HTTP 429 while resolving Gradle's Kotlin
          # buildSrc dependencies. Retry only that transient infrastructure
          # failure; do not mask compiler, source or Android packaging errors.
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/android-x86-build-${attempt}.log"
            if npm run tauri android build -- --ci --apk --debug --target x86_64 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'Received status code 429|Too Many Requests|HTTP 429' "$log"; then
              echo "::error::Android x86 build failed for a non-retryable reason (or exhausted retries)."
              exit 1
            fi
            echo "::warning::Gradle dependency server returned HTTP 429; waiting before bounded retry ${attempt}/3"
            sleep $((attempt * 60))
          done
      - name: Preserve compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: android-x86-debug-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator-launch:
    name: Install and launch x86_64 APK on KVM-accelerated Linux emulator
    needs: [fixture, build-x86]
    # Ubuntu 22.04 runner in 41199392719 did not reach a writable KVM
    # device; use the current GitHub-hosted Linux image and diagnose hardware
    # availability before spending time downloading an emulator.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-x86-debug-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk
      - uses: actions/download-artifact@v4
        with:
          name: android-synthetic-import-${{ github.sha }}
          path: android-synthetic-fixture
      # GitHub-hosted 2-vCPU Linux runners expose hardware acceleration when
      # the KVM device is made writable (GitHub Actions changelog 2024-04-02).
      # Fail immediately if unavailable rather than silently running an
      # overloaded software emulator and misdiagnosing editor import failures.
      - name: Diagnose and enable hardware-accelerated KVM
        run: |
          set -euo pipefail
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          uname -a
          echo "CPU virtualization flags:"
          grep -m 1 -E 'flags.*(vmx|svm)' /proc/cpuinfo || true
          echo "KVM device:"
          ls -l /dev/kvm || true
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This hosted runner exposes no /dev/kvm device. Hardware-accelerated emulator tests cannot run here; do not classify this as an application import failure."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [[ ! -w /dev/kvm ]]; then
            echo "::error::KVM exists but is not writable by the runner."
            exit 1
          fi
      - uses: android-actions/setup-android@v4
      - name: Confirm downloaded APK and source identity
        run: |
          test -n "$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          echo "Source: ${{ github.sha }}"
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec shasum -a 256 {} \;
      - name: Install and launch compiled APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # Retain API30 Google APIs for comparability with the previous
          # macOS test runs. Linux KVM replaces the CPU-starved macOS Intel
          # host that intermittently lost ADB/package-manager responsiveness.
          # Never count picker display or app launch as a successful import.
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          # Force hardware acceleration; never silently fall back to CPU-only
          # emulation, which caused extreme guest load and unstable DocumentsUI.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2 -accel on
          script: bash scripts/android-emulator-functional-smoke.sh
      - name: Preserve screenshot, UI hierarchy, ZIP import and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence-${{ github.sha }}
          path: android-runtime-evidence/**
          if-no-files-found: warn
          retention-days: 7
