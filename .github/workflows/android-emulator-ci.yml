name: Android native emulator UI smoke

# Dedicated, opt-in-by-file-change gate. The normal ARM64 APK job is not
# replaced: this one builds an x86_64 package from the same source, because
# the GitHub-hosted AVD cannot be assumed to execute an ARM64-only APK.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-ci.yml'
      - 'scripts/android-emulator-ci-portrait.py'

permissions:
  contents: read

concurrency:
  group: essentials-android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: 'true'
      ANDROID_EMULATOR_EVIDENCE: android-emulator-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Initialise Tauri Android Gradle wrapper
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npm ci
          npm run tauri android init -- --ci
      - uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-provider: basic
      - name: Build exact-HEAD x86_64 Android debug APK
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          npm run tauri android build -- --ci --apk --debug --target x86_64
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          test -s "$apk"
          printf '%s\n' "$apk" > android-emulator-apk-path.txt
          sha256sum "$apk" | tee android-emulator-built-apk.sha256
      - name: Enable hardware acceleration on the standard public runner
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This standard GitHub runner has no /dev/kvm; Android runtime test is blocked, not passed."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot API35 Android x86_64 and drive the actual Tauri app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/android-emulator-ci-portrait.py "$(cat android-emulator-apk-path.txt)"
      - name: Upload native emulator evidence even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essentials-native-emulator-ui-evidence
          path: |
            android-emulator-evidence/
            android-emulator-built-apk.sha256
            android-emulator-apk-path.txt
          if-no-files-found: warn
          retention-days: 7
