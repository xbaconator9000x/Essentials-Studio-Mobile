name: Android private image in-flight regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/inFlightImageLoads.ts'
      - 'src/services/imageLoader.ts'
      - 'src/services/privateImageRequests.ts'
      - 'src/services/imageCacheBudget.ts'
      - 'src/App.tsx'
      - 'tests/inFlightImageLoads.test.mjs'
      - 'tests/privateImageRequests.test.mjs'
      - '.github/workflows/private-image-inflight-tests.yml'

permissions:
  contents: read

jobs:
  image-inflight-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify concurrent private image request deduplication and retry
        run: node --experimental-strip-types --test tests/inFlightImageLoads.test.mjs tests/privateImageRequests.test.mjs
