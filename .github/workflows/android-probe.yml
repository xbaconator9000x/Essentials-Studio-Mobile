name: Android APK probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify project ZIP IPC chunk framing
        run: node --experimental-strip-types --test tests/archiveChunks.test.mjs
      - name: Verify lossless partial script Save All payload
        run: node --experimental-strip-types --test src/components/ScriptEditor/scriptSavePayload.test.ts
      - name: Verify serial map/event Save All and failure handling
        run: node --experimental-strip-types --test tests/saveBatch.test.mjs
      - name: Verify cross-editor project writes and ZIP snapshots
        run: node --experimental-strip-types --test tests/projectMutationQueue.test.mjs
      - name: Verify coordinated event clipboard paste and rollback
        run: node --experimental-strip-types --test tests/eventPasteTransaction.test.mjs
      - name: Verify dirty event saves before map navigation
        run: node --experimental-strip-types --test tests/mapNavigationSave.test.mjs
      - name: Verify map keyboard history and editor shortcut isolation
        run: node --experimental-strip-types --test tests/mapKeyboardHistory.test.mjs
      - run: node scripts/check-development-queue.mjs
      - name: Verify queue watchdog handoff behavior
        run: node --test scripts/queue-watchdog.test.mjs
      - name: Audit inherited ESLint findings (non-blocking during port bootstrap)
        continue-on-error: true
        run: npm run lint

  android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS dependencies
        run: npm ci
      - name: Initialise Android app (CI mode)
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npm run tauri android init -- --ci
      - name: Cache Gradle wrapper distribution and build state
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-provider: basic
      - name: Compile Android ARM64 debug APK
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # Gradle distribution and Maven mirrors can transiently return 429 or
          # 5xx responses. Retry only those network failures; do not mask
          # compiler, source or Android packaging errors.
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/android-arm64-build-${attempt}.log"
            if npm run tauri android build -- --ci --apk --debug --target aarch64 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq \
              'Received status code (429|502|503|504)|Too Many Requests|HTTP (429|502|503|504)|Server returned HTTP response code: (429|502|503|504)' \
              "$log"; then
              echo "::error::Android ARM64 build failed for a non-retryable reason (or exhausted retries)."
              exit 1
            fi
            echo "::warning::Gradle dependency server returned a transient HTTP error; waiting before bounded retry ${attempt}/3"
            sleep $((attempt * 60))
          done
      - name: Save build evidence and debug APK (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essentials-studio-android-arm64-probe
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/reports/**
          if-no-files-found: warn
          retention-days: 7
