name: Archive roundtrip tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/android-ci-bootstrap
    paths:
      - 'src-tauri/src/commands/project_archive.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/archive-roundtrip-tests.yml'

permissions:
  contents: read

concurrency:
  group: archive-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-archive:
    name: Native Rust archive tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri and desktop audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend resources for Tauri build context
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify archive import/export unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib commands::project_archive -- --nocapture
