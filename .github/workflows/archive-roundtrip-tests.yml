name: Archive roundtrip tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/src/commands/**'
      - 'src-tauri/src/models/**'
      - 'src-tauri/src/marshal/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'scripts/run_project_roundtrip.py'
      - 'tests/test_roundtrip_evidence.py'
      - 'scripts/verify_project_roundtrip.py'
      - 'tests/test_project_roundtrip.py'
      - '.github/workflows/archive-roundtrip-tests.yml'
  pull_request:
    branches:
      - main
      - feature/android-ci-bootstrap
    paths:
      - 'src-tauri/src/commands/**'
      - 'src-tauri/src/models/**'
      - 'src-tauri/src/marshal/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'scripts/run_project_roundtrip.py'
      - 'scripts/verify_project_roundtrip.py'
      - 'tests/test_project_roundtrip.py'
      - '.github/workflows/archive-roundtrip-tests.yml'


permissions:
  contents: read

concurrency:
  group: archive-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-archive:
    name: Native Rust archive tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri and desktop audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend resources for Tauri build context
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native import-edit-export and independent ZIP integrity
        env:
          PROJECT_ROUNDTRIP_EVIDENCE_DIR: ${{ runner.temp }}/essentials-synthetic-roundtrip
        run: python scripts/run_project_roundtrip.py
      - name: Upload commit-pinned verified synthetic project ZIPs and receipt
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-rmxp-roundtrip-${{ github.sha }}
          path: ${{ runner.temp }}/essentials-synthetic-roundtrip/
          if-no-files-found: error
          retention-days: 7
