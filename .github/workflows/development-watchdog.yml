name: Development queue watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Android APK probe", "Archive roundtrip tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: essentials-mobile-queue-watchdog
  cancel-in-progress: false

jobs:
  enqueue:
    name: Check and automatically hand off next eligible tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate durable queue and show next tasks
        run: |
          node scripts/check-development-queue.mjs
          node scripts/queue-watchdog.mjs
      - name: Regression test queue fallback when GitHub Issues are disabled
        run: node --test scripts/queue-watchdog.test.mjs
      - name: Verify automatic coding-agent selection and receipt safety
        run: node --test scripts/copilot-dispatch.test.mjs
      - name: Test free Jules cloud dispatch, daily budget and deduplication
        run: node --test scripts/jules-dispatch.test.mjs
      - name: Surface CI failures for the next implementation run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: echo "::warning::A CI workflow failed or was cancelled. Inspect the originating run before proceeding."
      - name: Chain eligible implementation handoffs to tracked issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/queue-watchdog.mjs --create-issues
      - name: Run free Jules coding agent if configured (paid Copilot opt-in only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CODING_AGENT_PROVIDER: ${{ vars.CODING_AGENT_PROVIDER }}
        run: |
          if [ -n "$JULES_API_KEY" ]; then
            node scripts/jules-dispatch.mjs
          elif [ "$CODING_AGENT_PROVIDER" = "copilot" ]; then
            node scripts/copilot-dispatch.mjs
          else
            echo "Free Jules not connected; paid Copilot NOT started. Add JULES_API_KEY to start free cloud coding." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report queue state
        run: |
          {
            echo "### Essentials Studio Mobile development queue"
            echo ""
            echo "The watchdog runs every five minutes as well as after main pushes and CI completion. With JULES_API_KEY and a connected Google Jules repository, it starts bounded free cloud coding sessions using durable receipts. Paid Copilot dispatch only occurs with an explicit CODING_AGENT_PROVIDER=copilot variable and no Jules secret. GitHub Issues are optional."
            echo "GitHub Copilot writes code only when separately configured. Agents open PRs for review; they never auto-merge or auto-approve acceptance."
            echo ""
            node scripts/queue-watchdog.mjs | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
