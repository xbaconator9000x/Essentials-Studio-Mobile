name: Development queue watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Android APK probe", "Archive roundtrip tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: essentials-mobile-queue-watchdog
  cancel-in-progress: false

jobs:
  enqueue:
    name: Check and automatically hand off next eligible tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate durable queue and show next tasks
        run: |
          node scripts/check-development-queue.mjs
          node scripts/queue-watchdog.mjs
      - name: Regression test queue fallback when GitHub Issues are disabled
        run: node --test scripts/queue-watchdog.test.mjs
      - name: Surface CI failures for the next implementation run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: echo "::warning::A CI workflow failed or was cancelled. Inspect the originating run before proceeding."
      - name: Chain eligible implementation handoffs to tracked issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/queue-watchdog.mjs --create-issues
      - name: Report queue state
        run: |
          {
            echo "### Essentials Studio Mobile development queue"
            echo ""
            echo "The watchdog checks the queue hourly, after main pushes and CI completion. Issue handoffs do not themselves code. It publishes handoffs; GitHub Actions does not start paid Copilot or any external AI service."
            echo "The existing ChatGPT coding watchdog performs implementation through its connected GitHub tools on its own schedule. No Copilot Pro subscription, paid agent API, or ChatGPT Work subscription is required for this GitHub workflow."
            echo ""
            node scripts/queue-watchdog.mjs | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
