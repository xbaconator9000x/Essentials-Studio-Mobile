name: Editor save failure regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/services/saveGuards.ts'
      - 'src/services/projectOpenGuards.ts'
      - 'tests/projectOpenGuards.test.mjs'
      - 'tests/saveGuards.test.mjs'
      - '.github/workflows/editor-save-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/services/saveGuards.ts'
      - 'src/services/projectOpenGuards.ts'
      - 'tests/projectOpenGuards.test.mjs'
      - 'tests/saveGuards.test.mjs'
      - '.github/workflows/editor-save-tests.yml'

permissions:
  contents: read

jobs:
  save-regression:
    name: Save failure and dirty-state guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify save errors propagate and dirty state remains set
        run: node --experimental-strip-types --test tests/saveGuards.test.mjs tests/projectOpenGuards.test.mjs
