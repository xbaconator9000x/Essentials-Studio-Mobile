name: Decoded graphics cache regression tests

on:
  push:
    branches: [main, 'fix/android-image-decoded-cache-budget-*', 'fix/android-image-load-concurrency-*']
    paths:
      - 'src/services/imageCacheBudget.ts'
      - 'src/services/boundedAsyncMap.ts'
      - 'src/services/imageLoader.ts'
      - 'tests/imageCacheBudget.test.mjs'
      - 'tests/boundedAsyncMap.test.mjs'
      - '.github/workflows/image-cache-tests.yml'
  pull_request:
    paths:
      - 'src/services/imageCacheBudget.ts'
      - 'src/services/boundedAsyncMap.ts'
      - 'src/services/imageLoader.ts'
      - 'tests/imageCacheBudget.test.mjs'
      - 'tests/boundedAsyncMap.test.mjs'
      - '.github/workflows/image-cache-tests.yml'

permissions:
  contents: read

jobs:
  image-cache-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify decoded image cache and bounded Android transfer limits
        run: node --experimental-strip-types --test tests/imageCacheBudget.test.mjs tests/boundedAsyncMap.test.mjs
